name: news_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.0
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  webview_flutter_web: ^0.2.3
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  geolocator: ^12.0.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FF5722"
  adaptive_icon_foreground: "assets/app_icon.png"